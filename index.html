<style>
:root{--dark:#131418;--base:#191b20;--glass:rgba(255,255,255,.045);--gb:rgba(255,255,255,.11);--gh:rgba(255,255,255,.18);
--rose:#d96b8a;--coral:#df7e71;--orange:#e4935e;--grad:linear-gradient(135deg,var(--rose),var(--coral),var(--orange));
--t1:#f2f2f5;--t2:#b4b7c2;--t3:#868a96;--nav-h:68px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:'Inter',sans-serif;color:var(--t1);background:radial-gradient(circle at 15% 15%,#22242c 0%,var(--base) 55%,var(--dark) 100%) fixed;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:6px}
/* background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(75px);transition:transform .6s ease-out}
.o1{width:340px;height:340px;background:var(--rose);opacity:.22;top:-60px;left:-50px}
.o2{width:300px;height:300px;background:var(--coral);opacity:.15;top:42%;left:55%}
.o3{width:380px;height:380px;background:var(--orange);opacity:.18;bottom:-90px;right:-60px}
.bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.45}
/* glass */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%);border:1px solid var(--gb);border-top-color:var(--gh);border-left-color:rgba(255,255,255,.14);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}
.hov:hover{transform:translateY(-4px);border-color:rgba(223,126,113,.55);box-shadow:0 14px 34px rgba(0,0,0,.38),0 0 22px rgba(217,107,138,.18),inset 0 1px 0 rgba(255,255,255,.1)}
/* nav */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,40px);border-radius:0;border-width:0 0 1px 0;background:rgba(19,20,24,.6)}
.logo{font-weight:700;letter-spacing:.9px;display:flex;align-items:center;gap:10px}
.logo i{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.links{display:flex;gap:4px;list-style:none}
.links a{display:block;padding:8px 14px;border-radius:99px;font-size:.88rem;font-weight:500;color:var(--t2);border:1px solid transparent;transition:.25s}
.links a:hover{color:var(--t1);border-color:rgba(223,126,113,.4);background:rgba(255,255,255,.05)}
.links a.active{color:var(--t1);background:var(--gradient-soft,linear-gradient(135deg,rgba(217,107,138,.2),rgba(228,147,94,.2)));border-color:rgba(223,126,113,.45)}
.burger{display:none;background:none;border:1px solid var(--gb);color:var(--t1);width:42px;height:42px;border-radius:10px;font-size:1.1rem;cursor:pointer;transition:.25s}
.burger:hover{border-color:var(--coral)}
@media(max-width:900px){
.burger{display:block}
.links{position:fixed;top:var(--nav-h);left:12px;right:12px;flex-direction:column;padding:10px;background:rgba(25,27,32,.92);backdrop-filter:blur(22px);border:1px solid var(--gb);border-radius:14px;opacity:0;transform:translateY(-10px);pointer-events:none;transition:.3s}
.links.open{opacity:1;transform:none;pointer-events:auto}
.links a{padding:13px 16px;border-radius:10px}}
/* layout */
main{position:relative;z-index:1;flex:1;width:100%;max-width:1080px;margin:0 auto;padding:calc(var(--nav-h) + 36px) clamp(16px,4vw,32px) 48px}
.page{animation:in .5s ease both}.page.out{animation:out .2s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-6px)}}
h1.title{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;margin-bottom:8px}
.grad{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.intro{max-width:75ch;margin-bottom:30px}
.sh{font-size:.95rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:14px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sh i{-webkit-text-fill-color:transparent}
.txt{color:var(--t2);line-height:1.7;font-size:.96rem;white-space:pre-line}
.txt.ph{color:var(--t3);font-style:italic}

.hero{display:flex;align-items:center;gap:36px;padding:34px;margin-bottom:28px}
.photo{flex:none;width:190px;height:190px;border-radius:50%;overflow:hidden;border:2px dashed rgba(223,126,113,.5);background:linear-gradient(145deg,rgba(217,107,138,.16),rgba(228,147,94,.14));box-shadow:0 10px 26px rgba(0,0,0,.35);transition:.35s}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.hero:hover .photo{border-color:var(--coral);box-shadow:0 0 30px rgba(217,107,138,.3)}

.hero h1{font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:1.5px;font-weight:700}
.role{color:var(--coral);font-weight:600;margin:6px 0 14px;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:22px}
.nc{display:block;padding:34px 30px;min-height:250px}
.nc i{font-size:1.8rem;margin-bottom:18px;display:block;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;transition:transform .3s}
.nc:hover i{transform:scale(1.15) rotate(-4deg)}
.nc h3{font-size:1.25rem;margin-bottom:12px}.nc .txt{font-size:.95rem}

.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:99px;font-weight:600;font-size:.9rem;border:1px solid rgba(223,126,113,.5);color:var(--t1);background:rgba(255,255,255,.05);cursor:pointer;transition:.3s;font-family:inherit}
.btn.main{background:var(--grad);border-color:transparent;color:#1a1114}

.row{display:flex;flex-wrap:wrap;gap:12px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.pad{padding:22px 24px}
.tl{border-left:1px solid rgba(255,255,255,.14);margin-left:5px;padding-left:20px;display:flex;flex-direction:column;gap:18px}
.tli{position:relative}

.tli b{display:block}.tli .d{color:var(--coral);font-size:.82rem;font-weight:500}.tli .p{color:var(--orange);font-size:.86rem;margin-top:2px}.tli p{color:var(--t2);font-size:.86rem;line-height:1.5;margin-top:3px}
.bar{margin-bottom:12px}.bar .m{display:flex;justify-content:space-between;font-size:.85rem;color:var(--t2);margin-bottom:5px}
.track{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-size:.84rem;background:rgba(255,255,255,.05);border:1px solid rgba(223,126,113,.3);margin:0 8px 8px 0;transition:.25s}
.pill:hover{border-color:var(--orange);transform:translateY(-2px)}
.lang{font-size:.9rem;color:var(--t2);margin-bottom:8px}.lang b{color:var(--t1);font-weight:500}.lang small{display:block;color:var(--t3)}
.intern{padding:24px;display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(217,107,138,.14),rgba(228,147,94,.14))}
.intern>i{font-size:1.8rem;color:var(--orange)}
/* coverflow carousel */
.cf{position:relative;margin-bottom:10px}
.stage{position:relative;height:clamp(250px,42vw,400px);perspective:1300px;overflow:hidden;touch-action:pan-y;user-select:none}
.cfc{position:absolute;top:6%;left:50%;width:clamp(210px,44%,400px);aspect-ratio:4/3;margin-left:calc(clamp(210px,44%,400px)/-2);padding:0;border:1px solid var(--gh);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--base);color:inherit;
 transform:translateX(calc(var(--d)*58%)) translateZ(calc(var(--a)*-150px)) rotateY(calc(var(--d)*-40deg));
 transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s,box-shadow .3s,border-color .3s;
 -webkit-box-reflect:below 4px linear-gradient(transparent 75%,rgba(255,255,255,.14));box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cfc .img{border-radius:0;aspect-ratio:auto;height:100%}
.cfc.on{border-color:rgba(223,126,113,.7);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 34px rgba(217,107,138,.3)}
.cfc.on:hover{border-color:var(--orange);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 44px rgba(228,147,94,.45)}
.cfc:not(.on){filter:brightness(.6) saturate(.8)}
.cfc:not(.on):hover{filter:brightness(.85)}
.cfc .badge{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--grad);color:#1a1114;z-index:2}
.cap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;max-width:620px;margin:26px auto 0;padding-bottom:10px;border-bottom:2px solid rgba(255,255,255,.18);position:relative}
.cap::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:var(--p,10%);background:var(--grad);transition:width .6s ease}
.cap h2{font-size:clamp(1.05rem,2.6vw,1.5rem);font-weight:700;text-transform:uppercase;letter-spacing:.5px;line-height:1.2}
.cnt{flex:none;font-size:.85rem;font-weight:600;color:var(--t1);padding:2px 10px;border:1px solid rgba(223,126,113,.4);border-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;font-weight:500;color:var(--orange);background:rgba(228,147,94,.11);border:1px solid rgba(228,147,94,.25);padding:2px 9px;border-radius:7px}
.cap-tags{max-width:620px;margin:12px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.arrows{display:flex;gap:10px}
.arr{width:46px;height:46px;border-radius:50%;border:1px solid rgba(223,126,113,.5);background:rgba(255,255,255,.05);color:var(--t1);cursor:pointer;font-size:1rem;transition:.3s}
.arr:hover{background:var(--grad);color:#1a1114;transform:scale(1.08);border-color:transparent}
.hint{color:var(--t3);font-size:.8rem;text-align:center;margin-top:14px}
/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,11,14,.7);backdrop-filter:blur(8px);animation:in .3s ease both}
.mbox{position:relative;width:100%;max-width:900px;max-height:90vh;overflow-y:auto;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:26px;background:rgba(30,32,38,.92)}
.mbox h2{font-size:1.5rem;margin-bottom:10px}
.mbox .tags{margin-bottom:16px}.mbox .btn{margin-top:20px}
.mx{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--gb);background:rgba(255,255,255,.06);color:var(--t1);cursor:pointer;z-index:2;transition:.25s}
.mx:hover{border-color:var(--coral);transform:rotate(90deg)}
@media(max-width:760px){.mbox{grid-template-columns:1fr;padding:20px}}
/* school logos */
.tli .r2{display:flex;gap:14px;align-items:flex-start}
.circ{flex:none;width:56px;height:56px;border-radius:50%;overflow:hidden;border:1px solid rgba(223,126,113,.5);background:linear-gradient(145deg,rgba(217,107,138,.18),rgba(228,147,94,.14));display:grid;place-items:center;position:relative;transition:.3s}
.circ img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tli:hover .circ{border-color:var(--orange);box-shadow:0 0 16px rgba(217,107,138,.3)}.tli:hover .circ img{transform:scale(1.12)}
.circ.empty::after{content:"\f19d";font-family:"Font Awesome 6 Free";font-weight:900;color:rgba(255,255,255,.35)}
/* media */
.img{overflow:hidden;border-radius:12px;background:linear-gradient(145deg,rgba(217,107,138,.16),rgba(228,147,94,.14));aspect-ratio:4/3;position:relative}
.img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.img:hover img,.blk:hover .img img{transform:scale(1.07)}
.img.empty::after{content:"\f03e";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:rgba(255,255,255,.2)}
.blk{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;padding:22px;margin-bottom:22px}
.blk:nth-child(even) .img{order:2}
/* footer */
footer{position:relative;z-index:1;margin:0 clamp(16px,4vw,32px) 24px;padding:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px}
footer ul{list-style:none;display:flex;flex-wrap:wrap;gap:12px 28px}
footer a,footer li span{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--t2);transition:.25s}
footer a:hover{color:var(--t1);transform:translateY(-2px)}
footer i{color:var(--rose);width:16px;text-align:center}
.copy{width:100%;color:var(--t3);font-size:.78rem}
@media(max-width:760px){
.hero{flex-direction:column;text-align:center;padding:26px 20px}
.two,.acc-c,.blk{grid-template-columns:1fr}
.blk:nth-child(even) .img{order:0}.blk{gap:16px}
.intern{flex-direction:column;text-align:center}.row{justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* Home cards: icon + title here, text loaded from assets/txt/carte_<page>.txt */
const NAV_CARDS=[
 ['careers','fa-graduation-cap','Careers'],
 ['projects','fa-code','Projects'],
 ['interests','fa-heart','Interests'],
 ['mobility','fa-earth-europe','Mobility'],
 ['civic-engagement','fa-hands-holding-circle','Civic Engagement']
];

 interests:{icon:'fa-heart',title:'Interests',intro:'What keeps me balanced outside of engineering: team sports, good food and quiet time by the water.',stem:'interet',

async function loadTexts(root){
 root.querySelectorAll('[data-txt]').forEach(async el=>{
  const f=el.dataset.txt;
  try{
   const r=await fetch(TXT+f,{cache:'no-cache'});
   if(!r.ok) throw 0;
   const t=(await r.text()).trim();
   if(!t) throw 0;
   el.textContent=t;
  }catch(e){
   el.classList.add('ph');
   el.textContent=`Text coming soon. Add your content in ${TXT}${f} (this also appears when the site is opened locally without a server).`;

 });
}

  <div class="row" style="margin-top:18px">
   <a class="btn main" href="${CV}CV_Justin_Roux_FR.pdf" download><i class="fa-solid fa-download"></i>Download CV (French)</a>
   <a class="btn main" href="${CV}CV_Justin_Roux_EN.pdf" download><i class="fa-solid fa-download"></i>Download CV (English)</a>
  </div></div>
 </section>
 <section class="glass intern hov" style="margin-bottom:20px"><i class="fa-solid fa-magnifying-glass"></i>
  <div><b>Looking for a 14-week paid IT internship</b><p class="txt">June – September 2027 · C/C++, Java, Python and Web development.</p></div></section>
 <div class="two">
  <section class="glass pad hov">${sh('fa-graduation-cap','Education')}<div class="tl">
   ${edu.map(e=>`<div class="tli"><div class="r2"><div class="circ"><img src="${IMG}${e[4]}" alt="${esc(e[2])}" loading="lazy" onerror="this.parentNode.classList.add('empty');this.remove()"></div><div><b>${e[0]}</b><span class="d">${e[1]}</span><div class="p">${e[2]}</div>${e[3]?`<p>${e[3]}</p>`:''}</div></div></div>`).join('')}</div></section>
  <section class="glass pad hov">${sh('fa-sliders','Technical skills')}
   ${bars.map(b=>`<div class="bar"><div class="m"><span>${b[0]}</span><span>${b[1]}</span></div><div class="track"><div class="fill" data-w="${b[2]}"></div></div></div>`).join('')}</section>
 </div>
 <div class="two">
  <section class="glass pad hov">${sh('fa-language','Languages')}
   <p class="lang"><b>French:</b> Native</p>
   <p class="lang"><b>German:</b> B2 &amp; Certified B1<small>Bescheinigung Deutsches Sprachdiplom</small></p>
   <p class="lang"><b>English:</b> B1–B2 (daily work experience)</p></section>

   <span class="pill">BAFA</span><span class="pill">PSC1 (First Aid)</span><span class="pill">Driving Licence B</span></section>

projects:()=>`
<h1 class="title grad">Projects</h1>
<p class="intro txt">Ten projects from my engineering studies. Select the centre card to see the full details and download the source archive.</p>
<div class="cf">
 <div class="stage" id="stage">
 ${PROJECTS.map((p,i)=>`<button class="cfc" data-i="${i}" aria-label="Project ${i+1}: ${esc(p[0])}"><span class="badge">${i+1}</span>${img(`photo_projet_${i+1}.jpg`,p[0])}</button>`).join('')}
 </div>
 <div class="cap"><h2 id="cft"></h2><span class="cnt" id="cnt"></span></div>
 <div class="cap-tags"><div class="tags" id="cftags"></div>
  <div class="arrows"><button class="arr" id="prev" aria-label="Previous project"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="arr" id="next" aria-label="Next project"><i class="fa-solid fa-chevron-right"></i></button></div></div>
 <p class="hint">Click the centre card for details · swipe or use the arrow keys to browse</p>
</div>`,
};
Object.entries(BLOCKS).forEach(([k,b])=>{
 pages[k]=()=>`<h1 class="title grad"><i class="fa-solid ${b.icon}"></i> ${b.title}</h1><div class="intro">${txt(`intro_${b.stem}.txt`)}</div>
 <div>${[1,2,3].map(n=>`<section class="glass hov blk">${img(`photo_${b.stem}_${n}.jpg`,b.heads[n-1])}
  <div><h3 style="margin-bottom:10px">${b.heads[n-1]}</h3>${txt(`description_${b.stem}_${n}.txt`)}</div></section>`).join('')}</div>`;
});

/* ============ ROUTER ============ */
const app=$('#app');let current=null;
function route(){
 let id=location.hash.replace('#','')||'home';
 if(!pages[id]) id='home';
 if(id===current) return;
 const old=$('.page',app);
 const render=()=>{
  current=id;
  app.innerHTML=`<div class="page">${pages[id]()}</div>`;
  window.scrollTo(0,0);
  document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('active',a.dataset.p===id));
  document.title=(id==='home'?'Justin Roux':id.replace('-',' ').replace(/\b\w/g,c=>c.toUpperCase())+' — Justin Roux')+' | ePortfolio';
  loadTexts(app);
  if(id==='projects')cfInit();
  setTimeout(()=>app.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),150);
 };
 if(old){old.classList.add('out');setTimeout(render,200)}else render();
 closeMenu();
}
window.addEventListener('hashchange',route);

/* projects carousel + detail modal */
function closeModal(){const m=$('#modal');if(m){m.remove();document.body.style.overflow=''}}
function openModal(i){
 const p=PROJECTS[i];
 const m=document.createElement('div');m.className='modal';m.id='modal';
 m.innerHTML=`<div class="glass mbox" role="dialog" aria-modal="true" aria-label="${esc(p[0])}">
  <button class="mx" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  ${img(`photo_projet_${i+1}.jpg`,p[0])}
  <div><h2 class="grad">${i+1}. ${esc(p[0])}</h2>
  <div class="tags">${p[1].map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  ${txt(`description_projet_${i+1}.txt`)}
  <a class="btn main" href="${ZIP}projet_${i+1}.zip" download><i class="fa-solid fa-file-zipper"></i>Download project (.zip)</a></div></div>`;
 document.body.appendChild(m);document.body.style.overflow='hidden';
 loadTexts(m);$('.mx',m).focus();
}
/* coverflow (infinite loop) */
let cfIdx=0,cfMoved=false;
function cfRender(){
 const cards=app.querySelectorAll('.cfc'),n=cards.length;if(!n)return;
 cards.forEach((c,i)=>{
  let d=((i-cfIdx)%n+n)%n;if(d>n/2)d-=n;
  const a=Math.abs(d);
  c.style.setProperty('--d',d);c.style.setProperty('--a',a);
  c.style.opacity=a>3?0:1-a*.22;c.style.pointerEvents=a>3?'none':'auto';
  c.style.zIndex=10-a;c.classList.toggle('on',d===0);c.tabIndex=d===0?0:-1;
 });
 const p=PROJECTS[cfIdx];
 $('#cft').textContent=p[0];$('#cnt').textContent=`${cfIdx+1}/${n}`;
 $('#cftags').innerHTML=p[1].map(t=>`<span class="tag">${esc(t)}</span>`).join('');
 $('.cap').style.setProperty('--p',((cfIdx+1)/n*100)+'%');
}
function cfGo(i){const n=PROJECTS.length;cfIdx=((i%n)+n)%n;cfRender()}
function cfInit(){cfIdx=0;cfRender()}
app.addEventListener('click',e=>{
 if(cfMoved){cfMoved=false;return}
 const c=e.target.closest('.cfc');
 if(c){const i=+c.dataset.i;return i===cfIdx?openModal(i):cfGo(i)}
 if(e.target.closest('#next'))cfGo(cfIdx+1);
 if(e.target.closest('#prev'))cfGo(cfIdx-1);
});
let sx=null;
app.addEventListener('pointerdown',e=>{sx=e.target.closest('#stage')?e.clientX:null});
window.addEventListener('pointerup',e=>{
 if(sx===null)return;const dx=e.clientX-sx;sx=null;
 if(Math.abs(dx)>45){cfMoved=true;setTimeout(()=>cfMoved=false,50);cfGo(cfIdx+(dx<0?1:-1))}
});
document.addEventListener('keydown',e=>{
 if(current!=='projects'||$('#modal'))return;
 if(e.key==='ArrowRight')cfGo(cfIdx+1);
 if(e.key==='ArrowLeft')cfGo(cfIdx-1);
});
document.addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.mx'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',closeModal);

/* burger menu */
const burger=$('#burger'),links=$('#links');
function closeMenu(){links.classList.remove('open');burger.setAttribute('aria-expanded','false');burger.firstElementChild.className='fa-solid fa-bars'}
burger.addEventListener('click',()=>{const o=links.classList.toggle('open');burger.setAttribute('aria-expanded',o);burger.firstElementChild.className='fa-solid '+(o?'fa-xmark':'fa-bars')});
document.addEventListener('click',e=>{if(!e.target.closest('nav'))closeMenu()});

/* orbs follow the mouse */
const orbs=document.querySelectorAll('.orb');
document.addEventListener('mousemove',e=>{
 const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
 orbs.forEach((o,i)=>{const f=(i+1)*40;o.style.transform=`translate(${x*f}px,${y*f}px)`});
});

$('#yr').textContent=new Date().getFullYear();
route();
</script>
</body>
</html>
